  <text x="600" y="183" text-anchor="middle" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="2">ANDROID DEVELOPER  ·  KOTLIN &amp; JAVA  ·  GENERATIVE AI</text>
